<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>

  <defs>
    <linearGradient id="strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="8" fill="url(#strip)"/>

  <!-- Title -->
  <text x="600" y="68" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#0f172a" text-anchor="middle">Почему ваш ИИ такой слабый</text>
  <text x="600" y="106" font-family="Arial, sans-serif" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="bold">и как исправить это за неделю</text>

  <line x1="60" y1="126" x2="1140" y2="126" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: 3 причины -->
  <rect x="60" y="146" width="360" height="44" rx="6" fill="#dc2626"/>
  <text x="240" y="174" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3 причины слабого ИИ</text>

  <rect x="60" y="202" width="360" height="76" rx="6" fill="#fef2f2"/>
  <text x="76" y="228" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">Причина 1</text>
  <text x="76" y="250" font-family="Arial, sans-serif" font-size="15" fill="#374151">Нет контекста — кто вы и что важно</text>
  <text x="76" y="268" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">ИИ отвечает буквально на заданный вопрос</text>

  <rect x="60" y="290" width="360" height="76" rx="6" fill="#fef2f2"/>
  <text x="76" y="316" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">Причина 2</text>
  <text x="76" y="338" font-family="Arial, sans-serif" font-size="15" fill="#374151">Нет роли — ИИ угадывает</text>
  <text x="76" y="356" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Без контекста задачи — обобщённые ответы</text>

  <rect x="60" y="378" width="360" height="76" rx="6" fill="#fef2f2"/>
  <text x="76" y="404" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">Причина 3</text>
  <text x="76" y="426" font-family="Arial, sans-serif" font-size="15" fill="#374151">Нет накопления — каждый раз с нуля</text>
  <text x="76" y="444" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Контекст объясняется заново и заново</text>

  <!-- Middle: Тамагочи-метафора -->
  <rect x="460" y="146" width="280" height="308" rx="8" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="56" text-anchor="middle">🐣</text>
  <text x="600" y="266" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7c3aed" text-anchor="middle">ИИ = тамагочи</text>
  <text x="600" y="294" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Без ухода (контекста)</text>
  <text x="600" y="314" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">деградирует</text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">С уходом — партнёр,</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">который в теме</text>
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Мультипликатор:</text>
  <text x="600" y="432" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#7c3aed" text-anchor="middle">1.5–2.5×</text>

  <!-- Right: 3 шага -->
  <rect x="780" y="146" width="360" height="44" rx="6" fill="#059669"/>
  <text x="960" y="174" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3 шага за эту неделю</text>

  <rect x="780" y="202" width="360" height="76" rx="6" fill="#ecfdf5"/>
  <text x="796" y="228" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#065f46">Шаг 1</text>
  <text x="796" y="250" font-family="Arial, sans-serif" font-size="15" fill="#374151">Написать инструкцию «кто вы»</text>
  <text x="796" y="268" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">20 минут один раз → эффект навсегда</text>

  <rect x="780" y="290" width="360" height="76" rx="6" fill="#ecfdf5"/>
  <text x="796" y="316" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#065f46">Шаг 2</text>
  <text x="796" y="338" font-family="Arial, sans-serif" font-size="15" fill="#374151">Создать роль для регулярной задачи</text>
  <text x="796" y="356" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Отчёты, письма, анализ — один раз описать</text>

  <rect x="780" y="378" width="360" height="76" rx="6" fill="#ecfdf5"/>
  <text x="796" y="404" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#065f46">Шаг 3</text>
  <text x="796" y="426" font-family="Arial, sans-serif" font-size="15" fill="#374151">Фиксировать решения в документе</text>
  <text x="796" y="444" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">ИИ знает предысторию следующий раз</text>

  <!-- Bottom banner -->
  <rect x="0" y="474" width="1200" height="118" fill="#0f172a"/>
  <text x="600" y="516" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ИИ слабый не потому, что модель плохая.</text>
  <text x="600" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#a78bfa" text-anchor="middle">А потому что его не кормят контекстом.</text>
  <text x="600" y="578" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">systemsworld.club</text>

  <rect y="622" width="1200" height="8" fill="url(#strip)"/>
</svg>
