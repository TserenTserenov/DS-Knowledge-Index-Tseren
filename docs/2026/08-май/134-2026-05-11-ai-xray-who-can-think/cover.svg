<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Upper gradient strip -->
  <defs>
    <linearGradient id="topStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="8" fill="url(#topStrip)"/>

  <!-- Title -->
  <text x="600" y="72" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#0f172a" text-anchor="middle">ИИ показал, кто на самом деле умеет думать</text>
  <text x="600" y="108" font-family="Arial, sans-serif" font-size="20" fill="#475569" text-anchor="middle">Рентген-эффект: ИИ усиливает то, что есть</text>

  <!-- Divider -->
  <line x1="60" y1="128" x2="1140" y2="128" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left column: Слабое мышление -->
  <rect x="60" y="148" width="330" height="44" rx="6" fill="#dc2626"/>
  <text x="225" y="176" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Слабое мышление</text>

  <rect x="60" y="204" width="330" height="88" rx="6" fill="#fef2f2"/>
  <text x="75" y="228" font-family="Arial, sans-serif" font-size="15" fill="#991b1b" font-weight="bold">Симптом 1</text>
  <text x="75" y="250" font-family="Arial, sans-serif" font-size="14" fill="#374151">Нет формулировки задачи</text>
  <text x="75" y="270" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">«Помоги с маркетингом»</text>

  <rect x="60" y="304" width="330" height="88" rx="6" fill="#fef2f2"/>
  <text x="75" y="328" font-family="Arial, sans-serif" font-size="15" fill="#991b1b" font-weight="bold">Симптом 2</text>
  <text x="75" y="350" font-family="Arial, sans-serif" font-size="14" fill="#374151">Нет декомпозиции</text>
  <text x="75" y="370" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Большая задача комком в чат</text>

  <rect x="60" y="404" width="330" height="88" rx="6" fill="#fef2f2"/>
  <text x="75" y="428" font-family="Arial, sans-serif" font-size="15" fill="#991b1b" font-weight="bold">Симптом 3</text>
  <text x="75" y="450" font-family="Arial, sans-serif" font-size="14" fill="#374151">Нет удержания контекста</text>
  <text x="75" y="470" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Каждый раз с нуля</text>

  <!-- Middle: ИИ-усилитель -->
  <rect x="430" y="148" width="340" height="344" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="60" text-anchor="middle" fill="#7c3aed">⚡</text>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">ИИ — усилитель</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Не создаёт структуру —</text>
  <text x="600" y="332" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">отражает вашу</text>
  <line x1="470" y1="360" x2="730" y2="360" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Нет структуры в голове →</text>
  <text x="600" y="415" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">нет структуры в результате</text>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Есть мышление →</text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">результат ×5</text>

  <!-- Right column: Сильное мышление -->
  <rect x="810" y="148" width="330" height="44" rx="6" fill="#059669"/>
  <text x="975" y="176" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Сильное мышление</text>

  <rect x="810" y="204" width="330" height="88" rx="6" fill="#ecfdf5"/>
  <text x="825" y="228" font-family="Arial, sans-serif" font-size="15" fill="#065f46" font-weight="bold">Навык 1</text>
  <text x="825" y="250" font-family="Arial, sans-serif" font-size="14" fill="#374151">Чёткая формулировка задачи</text>
  <text x="825" y="270" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Контекст + ограничения + критерий</text>

  <rect x="810" y="304" width="330" height="88" rx="6" fill="#ecfdf5"/>
  <text x="825" y="328" font-family="Arial, sans-serif" font-size="15" fill="#065f46" font-weight="bold">Навык 2</text>
  <text x="825" y="350" font-family="Arial, sans-serif" font-size="14" fill="#374151">Декомпозиция</text>
  <text x="825" y="370" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Большое → управляемые части</text>

  <rect x="810" y="404" width="330" height="88" rx="6" fill="#ecfdf5"/>
  <text x="825" y="428" font-family="Arial, sans-serif" font-size="15" fill="#065f46" font-weight="bold">Навык 3</text>
  <text x="825" y="450" font-family="Arial, sans-serif" font-size="14" fill="#374151">Удержание контекста</text>
  <text x="825" y="470" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Накопленная история решений</text>

  <!-- Bottom banner -->
  <rect x="0" y="512" width="1200" height="90" fill="#0f172a"/>
  <text x="600" y="552" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Мышление прокачивается. И ИИ в этом помогает — если начать правильно.</text>
  <text x="600" y="584" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">systemsworld.club</text>

  <!-- Lower gradient strip -->
  <rect y="622" width="1200" height="8" fill="url(#topStrip)"/>
</svg>
