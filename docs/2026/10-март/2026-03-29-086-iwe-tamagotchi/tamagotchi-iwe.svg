<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="400" height="500" fill="#f0f4ff"/>

  <!-- ── Device body ── -->
  <!-- Shadow -->
  <ellipse cx="202" cy="408" rx="115" ry="18" fill="#c7d2fe" opacity="0.5"/>
  <!-- Main body -->
  <rect x="80" y="60" width="240" height="330" rx="50" fill="#ffffff" stroke="#818cf8" stroke-width="3"/>
  <!-- Inner rim -->
  <rect x="96" y="76" width="208" height="298" rx="40" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>

  <!-- ── Screen ── -->
  <rect x="118" y="102" width="164" height="148" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- Screen glow -->
  <rect x="118" y="102" width="164" height="148" rx="16" fill="url(#screenGlow)" opacity="0.3"/>
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── AI Robot face on screen ── -->
  <!-- Robot head -->
  <rect x="158" y="118" width="84" height="76" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="200" y1="118" x2="200" y2="106" stroke="#818cf8" stroke-width="2"/>
  <circle cx="200" cy="103" r="5" fill="#a5b4fc"/>
  <!-- Eyes (LED-style) -->
  <rect x="168" y="136" width="20" height="14" rx="4" fill="#1e1b4b"/>
  <rect x="212" y="136" width="20" height="14" rx="4" fill="#1e1b4b"/>
  <!-- Eye glow -->
  <rect x="170" y="138" width="16" height="10" rx="3" fill="#00e5ff" opacity="0.9"/>
  <rect x="214" y="138" width="16" height="10" rx="3" fill="#00e5ff" opacity="0.9"/>
  <!-- Mouth (pixel grid) -->
  <rect x="174" y="162" width="6" height="6" rx="1" fill="#818cf8"/>
  <rect x="184" y="158" width="6" height="6" rx="1" fill="#a5b4fc"/>
  <rect x="194" y="158" width="6" height="6" rx="1" fill="#a5b4fc"/>
  <rect x="204" y="162" width="6" height="6" rx="1" fill="#818cf8"/>
  <!-- Chest panel -->
  <rect x="172" y="178" width="56" height="24" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <circle cx="186" cy="190" r="4" fill="#22d3ee"/>
  <circle cx="200" cy="190" r="4" fill="#818cf8"/>
  <circle cx="214" cy="190" r="4" fill="#22d3ee"/>
  <!-- Screen bottom text -->
  <text x="200" y="236" text-anchor="middle" fill="#818cf8" font-size="9" letter-spacing="1">IWE v2.0</text>

  <!-- ── Buttons ── -->
  <!-- Left button -->
  <circle cx="128" cy="292" r="16" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
  <text x="128" y="297" text-anchor="middle" fill="white" font-size="14" font-weight="700">◀</text>
  <!-- Center button (main) -->
  <circle cx="200" cy="300" r="20" fill="#4f46e5" stroke="#3730a3" stroke-width="2.5"/>
  <circle cx="200" cy="300" r="13" fill="#6366f1"/>
  <circle cx="200" cy="300" r="6" fill="#a5b4fc"/>
  <!-- Right button -->
  <circle cx="272" cy="292" r="16" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
  <text x="272" y="297" text-anchor="middle" fill="white" font-size="14" font-weight="700">▶</text>

  <!-- ── Keychain hole ── -->
  <circle cx="200" cy="66" r="8" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <circle cx="200" cy="66" r="4" fill="none" stroke="#818cf8" stroke-width="1.5"/>

  <!-- ── Brand label ── -->
  <text x="200" y="358" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="600" letter-spacing="2">IWE-GOTCHI</text>

  <!-- ── Caption ── -->
  <text x="200" y="440" text-anchor="middle" fill="#6366f1" font-size="15" font-weight="700">Вырасти своего ИИ</text>
  <text x="200" y="462" text-anchor="middle" fill="#9ca3af" font-size="12">Нельзя купить. Только вырастить.</text>

</svg>
