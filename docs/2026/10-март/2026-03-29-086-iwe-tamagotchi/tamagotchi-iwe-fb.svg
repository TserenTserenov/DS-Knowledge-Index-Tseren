<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif">

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle glow behind device -->
  <ellipse cx="400" cy="315" rx="280" ry="260" fill="url(#glow)"/>

  <!-- ══════════════════════════════
       DEVICE (left-center)
  ══════════════════════════════ -->

  <!-- Shadow -->
  <ellipse cx="402" cy="574" rx="140" ry="18" fill="#c7d2fe" opacity="0.45"/>

  <!-- Body -->
  <rect x="262" y="68" width="280" height="490" rx="60" fill="#ffffff" stroke="#818cf8" stroke-width="3.5"/>
  <!-- Inner rim -->
  <rect x="280" y="86" width="244" height="454" rx="48" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>

  <!-- Screen -->
  <rect x="302" y="114" width="200" height="188" rx="18" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="302" y="114" width="200" height="188" rx="18" fill="url(#screenGlow)" opacity="0.25"/>

  <!-- Robot head -->
  <rect x="352" y="132" width="100" height="94" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="402" y1="132" x2="402" y2="118" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="402" cy="114" r="7" fill="#a5b4fc"/>
  <!-- Eyes -->
  <rect x="364" y="152" width="26" height="18" rx="5" fill="#1e1b4b"/>
  <rect x="414" y="152" width="26" height="18" rx="5" fill="#1e1b4b"/>
  <rect x="366" y="154" width="22" height="14" rx="4" fill="#00e5ff" opacity="0.95"/>
  <rect x="416" y="154" width="22" height="14" rx="4" fill="#00e5ff" opacity="0.95"/>
  <!-- Mouth -->
  <rect x="372" y="182" width="8" height="8" rx="2" fill="#818cf8"/>
  <rect x="384" y="177" width="8" height="8" rx="2" fill="#a5b4fc"/>
  <rect x="396" y="177" width="8" height="8" rx="2" fill="#a5b4fc"/>
  <rect x="408" y="182" width="8" height="8" rx="2" fill="#818cf8"/>
  <!-- Chest -->
  <rect x="368" y="200" width="68" height="20" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="384" cy="210" r="5" fill="#22d3ee"/>
  <circle cx="402" cy="210" r="5" fill="#818cf8"/>
  <circle cx="420" cy="210" r="5" fill="#22d3ee"/>
  <!-- Screen label -->
  <text x="402" y="292" text-anchor="middle" fill="#818cf8" font-size="11" letter-spacing="1.5">IWE v2.0</text>

  <!-- Buttons -->
  <circle cx="312" cy="358" r="22" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
  <text x="312" y="365" text-anchor="middle" fill="white" font-size="18" font-weight="700">◀</text>

  <circle cx="402" cy="368" r="28" fill="#4f46e5" stroke="#3730a3" stroke-width="3"/>
  <circle cx="402" cy="368" r="18" fill="#6366f1"/>
  <circle cx="402" cy="368" r="8" fill="#a5b4fc"/>

  <circle cx="492" cy="358" r="22" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
  <text x="492" y="365" text-anchor="middle" fill="white" font-size="18" font-weight="700">▶</text>

  <!-- Keychain -->
  <circle cx="402" cy="74" r="10" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <circle cx="402" cy="74" r="5" fill="none" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Brand -->
  <text x="402" y="450" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600" letter-spacing="3">IWE-GOTCHI</text>

  <!-- ══════════════════════════════
       RIGHT TEXT BLOCK
  ══════════════════════════════ -->

  <!-- Main headline -->
  <text x="660" y="160" fill="#1e1b4b" font-size="38" font-weight="800" letter-spacing="-0.5">ИИ-ассистент</text>
  <text x="660" y="208" fill="#1e1b4b" font-size="38" font-weight="800" letter-spacing="-0.5">не выдаётся</text>
  <text x="660" y="256" fill="#1e1b4b" font-size="38" font-weight="800" letter-spacing="-0.5">из коробки</text>

  <!-- Divider -->
  <line x1="660" y1="278" x2="1120" y2="278" stroke="#c7d2fe" stroke-width="2"/>

  <!-- Two roles -->
  <!-- Creator -->
  <rect x="660" y="300" width="200" height="90" rx="14" fill="#f5f3ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="760" y="330" text-anchor="middle" fill="#4f46e5" font-size="16" font-weight="700">СОЗДАТЕЛЬ</text>
  <text x="760" y="352" text-anchor="middle" fill="#6b7280" font-size="13">проектирует · обучает</text>
  <text x="760" y="372" text-anchor="middle" fill="#6b7280" font-size="13">корректирует</text>

  <!-- Arrow between roles -->
  <line x1="872" y1="345" x2="900" y2="345" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- User -->
  <rect x="912" y="300" width="200" height="90" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="1012" y="330" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">ПОЛЬЗОВАТЕЛЬ</text>
  <text x="1012" y="352" text-anchor="middle" fill="#6b7280" font-size="13">ставит задачи</text>
  <text x="1012" y="372" text-anchor="middle" fill="#6b7280" font-size="13">получает результат</text>

  <!-- Body text -->
  <text x="660" y="430" fill="#374151" font-size="15">Купить не получится.</text>
  <text x="660" y="454" fill="#374151" font-size="15">ChatGPT, Claude и Gemini дают яйцо —</text>
  <text x="660" y="478" fill="#374151" font-size="15">ты сам решаешь, вырастить питомца или нет.</text>

  <!-- Tagline -->
  <text x="660" y="540" fill="#6366f1" font-size="20" font-weight="700">Нельзя купить. Только вырастить.</text>

</svg>
