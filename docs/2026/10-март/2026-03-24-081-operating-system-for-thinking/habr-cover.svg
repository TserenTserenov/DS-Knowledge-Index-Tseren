<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
  <rect width="780" height="440" fill="#ffffff"/>

  <defs>
    <linearGradient id="strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="780" height="6" fill="url(#strip)"/>

  <!-- Title -->
  <text x="390" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">Культура работы: 14 элементов</text>
  <text x="390" y="80" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">операционной системы мышления</text>
  <text x="390" y="108" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Как поднять продуктивность в 2+ раза через культуру работы</text>

  <line x1="40" y1="122" x2="740" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Three columns: Протоколы / Навыки / Форматы -->

  <!-- Column 1: Протоколы -->
  <rect x="40" y="136" width="218" height="36" rx="5" fill="#2563eb"/>
  <text x="149" y="159" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Протоколы (7)</text>

  <rect x="40" y="180" width="218" height="180" rx="5" fill="#eff6ff"/>
  <text x="52" y="202" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">1. ОРЗ-фрактал</text>
  <text x="52" y="222" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">2. Каскад планирования</text>
  <text x="52" y="242" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">3. Ритуал учёта (РП+роль)</text>
  <text x="52" y="262" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">4. АрхГейт</text>
  <text x="52" y="282" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">5. Pre-action Gates</text>
  <text x="52" y="302" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">6. Стоп-лист РП</text>
  <text x="52" y="322" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">7. Эволюция системы</text>
  <text x="52" y="350" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">Формализованные последовательности</text>

  <!-- Column 2: Навыки -->
  <rect x="281" y="136" width="218" height="36" rx="5" fill="#7c3aed"/>
  <text x="390" y="159" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Навыки (5)</text>

  <rect x="281" y="180" width="218" height="180" rx="5" fill="#f5f3ff"/>
  <text x="293" y="202" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95">1. Capture-to-Pack</text>
  <text x="293" y="222" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95">2. Мультитаскинг</text>
  <text x="293" y="242" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95">3. Мультиагентность</text>
  <text x="293" y="262" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95">4. Экзоскелетный режим</text>
  <text x="293" y="282" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95">5. Самоисправление</text>
  <text x="293" y="322" font-family="Arial, sans-serif" font-size="12" fill="#6d28d9">Нарабатываются со временем</text>

  <!-- Column 3: Форматы -->
  <rect x="522" y="136" width="218" height="36" rx="5" fill="#059669"/>
  <text x="631" y="159" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Форматы (2)</text>

  <rect x="522" y="180" width="218" height="180" rx="5" fill="#ecfdf5"/>
  <text x="534" y="202" font-family="Arial, sans-serif" font-size="13" fill="#065f46">1. Структура знаний</text>
  <text x="534" y="222" font-family="Arial, sans-serif" font-size="13" fill="#065f46">   DS → Pack → Base</text>
  <text x="534" y="248" font-family="Arial, sans-serif" font-size="13" fill="#065f46">2. ВДВ-чеклист</text>
  <text x="534" y="268" font-family="Arial, sans-serif" font-size="13" fill="#065f46">   Выполнение + Данные</text>
  <text x="534" y="288" font-family="Arial, sans-serif" font-size="13" fill="#065f46">   + Видимость</text>
  <text x="534" y="322" font-family="Arial, sans-serif" font-size="12" fill="#059669">Стандарты оформления</text>

  <!-- Multiplier badge -->
  <rect x="281" y="370" width="218" height="40" rx="6" fill="#0f172a"/>
  <text x="390" y="396" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Мультипликатор: 1.5–2.5×</text>

  <!-- Bottom banner -->
  <rect x="0" y="418" width="780" height="22" fill="#0f172a"/>
  <text x="390" y="434" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Убери один элемент — система рассыпется</text>

  <rect y="434" width="780" height="6" fill="url(#strip)"/>
</svg>
