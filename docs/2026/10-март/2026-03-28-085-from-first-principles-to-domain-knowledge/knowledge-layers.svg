<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <style>
      .bg { fill: #0f1419; }
      .layer-fpf { fill: #1a2332; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .layer-spf { fill: #1a2332; stroke: #8b5cf6; stroke-width: 2; rx: 12; }
      .layer-pack { fill: #1a2332; stroke: #f59e0b; stroke-width: 2; rx: 12; }
      .layer-ds { fill: #1a2332; stroke: #6b7280; stroke-width: 2; rx: 12; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; }
      .layer-desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; }
      .layer-files { fill: #64748b; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; }
      .badge-given { fill: #3b82f6; rx: 4; }
      .badge-user { fill: #f59e0b; rx: 4; }
      .badge-text { fill: #fff; font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { fill: #64748b; font-family: -apple-system, sans-serif; font-size: 11px; text-anchor: middle; }
      .phase-label { fill: #94a3b8; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; text-anchor: end; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="520"/>

  <!-- Title -->
  <text class="title" x="450" y="40" text-anchor="middle">От первых принципов до описания предметной области</text>
  <text class="subtitle" x="450" y="60" text-anchor="middle">Четыре слоя организации знания в IWE</text>

  <!-- Phase labels on left -->
  <text class="phase-label" x="70" y="135" fill="#3b82f6">ДАНО</text>
  <text class="phase-label" x="70" y="235" fill="#8b5cf6">ДАНО</text>
  <text class="phase-label" x="70" y="345" fill="#f59e0b">СОЗДАЁШЬ</text>
  <text class="phase-label" x="70" y="455" fill="#6b7280">СОЗДАЁШЬ</text>

  <!-- Layer 1: FPF -->
  <rect class="layer-fpf" x="90" y="85" width="720" height="80"/>
  <text class="layer-title" x="120" y="115" fill="#3b82f6">FPF — First Principles Framework</text>
  <text class="layer-desc" x="120" y="135">Универсальные различения: метод != инструмент, объект != описание != носитель, знание != обучение</text>
  <text class="layer-files" x="120" y="153">Автор: Анатолий Левенчук  |  Применяется, не создаётся</text>

  <!-- Arrow 1→2 -->
  <line class="arrow" x1="450" y1="165" x2="450" y2="185"/>
  <text class="arrow-label" x="490" y="180">язык мышления</text>

  <!-- Layer 2: SPF -->
  <rect class="layer-spf" x="90" y="190" width="720" height="80"/>
  <text class="layer-title" x="120" y="220" fill="#8b5cf6">SPF — Second Principles Framework</text>
  <text class="layer-desc" x="120" y="240">Форма и процесс: каноническая структура Pack, 11 стадий формирования, process-lint</text>
  <text class="layer-files" x="120" y="258">pack-template/  |  process/00-process-overview.md  |  process-lint.md</text>

  <!-- Arrow 2→3 -->
  <line class="arrow" x1="450" y1="270" x2="450" y2="295"/>
  <text class="arrow-label" x="490" y="289">форма записи</text>

  <!-- Layer 3: Pack -->
  <rect class="layer-pack" x="90" y="300" width="720" height="90"/>
  <text class="layer-title" x="120" y="330" fill="#f59e0b">Pack — Паспорт предметной области</text>
  <text class="layer-desc" x="120" y="350">Формализованные вторые принципы: bounded context, различения, методы, рабочие продукты, failure modes, SoTA</text>
  <text class="layer-files" x="120" y="368">00-pack-manifest.md  |  01A-bounded-context.md  |  01B-distinctions.md  |  02-..07-*/</text>
  <text class="layer-desc" x="120" y="383" fill="#f59e0b" font-size="11px" font-weight="600">Source-of-truth для доменного знания</text>

  <!-- Arrow 3→4 -->
  <line class="arrow" x1="450" y1="390" x2="450" y2="410"/>
  <text class="arrow-label" x="505" y="407">source-of-truth</text>

  <!-- Layer 4: DS -->
  <rect class="layer-ds" x="90" y="415" width="720" height="75"/>
  <text class="layer-title" x="120" y="445" fill="#6b7280">DS — Downstream (производные системы)</text>
  <text class="layer-desc" x="120" y="465">Боты, курсы, дашборды, RAG-индексы — всё строится из Pack, не подменяет его</text>
  <text class="layer-files" x="120" y="480">DS-aist-bot/  |  DS-principles-curriculum/  |  DS-Knowledge-Index/</text>

  <!-- Right side: badges -->
  <rect class="badge-given" x="730" y="100" width="60" height="20"/>
  <text class="badge-text" x="760" y="114" text-anchor="middle">ДАНО</text>

  <rect class="badge-given" x="730" y="205" width="60" height="20"/>
  <text class="badge-text" x="760" y="219" text-anchor="middle">ДАНО</text>

  <rect class="badge-user" x="715" y="315" width="75" height="20"/>
  <text class="badge-text" x="752" y="329" text-anchor="middle">ЧЕЛОВЕК</text>

  <rect class="badge-user" x="715" y="430" width="75" height="20"/>
  <text class="badge-text" x="752" y="444" text-anchor="middle">ЧЕЛОВЕК</text>

</svg>
