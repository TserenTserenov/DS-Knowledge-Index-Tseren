<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f9b8e"/>
      <stop offset="100%" style="stop-color:#44bd9e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="780" height="440" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="110" x2="780" y2="110"/>
    <line x1="0" y1="220" x2="780" y2="220"/>
    <line x1="0" y1="330" x2="780" y2="330"/>
    <line x1="195" y1="0" x2="195" y2="440"/>
    <line x1="390" y1="0" x2="390" y2="440"/>
    <line x1="585" y1="0" x2="585" y2="440"/>
  </g>

  <!-- Title -->
  <text x="390" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Knowledge Gateway</text>
  <text x="390" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#8899aa">IWE теперь доступен из браузера</text>

  <!-- Accent line -->
  <rect x="290" y="115" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Top row: clients -->
  <g transform="translate(0, 145)">
    <!-- claude.ai -->
    <rect x="60" y="0" width="120" height="45" rx="8" fill="#2a2a4a" stroke="#0f9b8e" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff">claude.ai</text>

    <!-- ChatGPT -->
    <rect x="220" y="0" width="120" height="45" rx="8" fill="#2a2a4a" stroke="#555" stroke-width="1"/>
    <text x="280" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#888">ChatGPT</text>

    <!-- VS Code -->
    <rect x="380" y="0" width="120" height="45" rx="8" fill="#2a2a4a" stroke="#555" stroke-width="1"/>
    <text x="440" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#888">VS Code</text>

    <!-- Bot -->
    <rect x="540" y="0" width="120" height="45" rx="8" fill="#2a2a4a" stroke="#555" stroke-width="1"/>
    <text x="600" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#888">Telegram</text>

    <!-- Mobile -->
    <rect x="700" y="0" width="55" height="45" rx="8" fill="#2a2a4a" stroke="#555" stroke-width="1"/>
    <text x="727" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">...</text>
  </g>

  <!-- Arrows down -->
  <g stroke="#0f9b8e" stroke-width="1.5" fill="none">
    <line x1="120" y1="195" x2="390" y2="230"/>
    <line x1="280" y1="195" x2="390" y2="230"/>
    <line x1="440" y1="195" x2="390" y2="230"/>
    <line x1="600" y1="195" x2="390" y2="230"/>
  </g>

  <!-- Gateway box -->
  <rect x="230" y="230" width="320" height="55" rx="12" fill="#0f9b8e" fill-opacity="0.15" stroke="#0f9b8e" stroke-width="2"/>
  <text x="390" y="253" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f9b8e">mcp.aisystant.com</text>
  <text x="390" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6fbbae">OAuth 2.1 (Ory Hydra) + Streamable HTTP</text>

  <!-- Arrows down from gateway -->
  <g stroke="#44bd9e" stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="310" y1="290" x2="170" y2="330"/>
    <line x1="390" y1="290" x2="390" y2="330"/>
    <line x1="470" y1="290" x2="610" y2="330"/>
  </g>

  <!-- Bottom row: backends -->
  <!-- Knowledge MCP -->
  <rect x="80" y="330" width="180" height="65" rx="10" fill="#1e3a5f" stroke="#3a7bd5" stroke-width="1"/>
  <text x="170" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6aadff">Knowledge (L2)</text>
  <text x="170" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5588aa">Pack, курсы, руководства</text>
  <text x="170" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5588aa">3300+ документов</text>

  <!-- Personal MCP -->
  <rect x="300" y="330" width="180" height="65" rx="10" fill="#1e3a5f" stroke="#3a7bd5" stroke-width="1"/>
  <text x="390" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6aadff">Personal (L4)</text>
  <text x="390" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5588aa">GitHub-репо пользователя</text>
  <text x="390" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5588aa">заметки, стратегия</text>

  <!-- Digital Twin -->
  <rect x="520" y="330" width="180" height="65" rx="10" fill="#1e3a5f" stroke="#3a7bd5" stroke-width="1"/>
  <text x="610" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6aadff">Digital Twin</text>
  <text x="610" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5588aa">профиль, цели</text>
  <text x="610" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5588aa">показатели, ступень</text>

  <!-- URL badge -->
  <rect x="255" y="410" width="270" height="22" rx="11" fill="#0f9b8e" fill-opacity="0.2"/>
  <text x="390" y="425" text-anchor="middle" font-family="monospace" font-size="11" fill="#44bd9e">один URL -- вся платформа знаний</text>
</svg>
