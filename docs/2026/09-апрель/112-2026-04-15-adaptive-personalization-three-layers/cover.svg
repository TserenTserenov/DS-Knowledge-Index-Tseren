<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="30" fill="#f8fafc" text-anchor="middle" font-weight="bold">Три слоя адаптивной персонализации</text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Платформа, которая знает тебя</text>

  <!-- === COLUMN 1: ПЕРСОНАЛИЗАЦИЯ === -->
  <rect x="60" y="115" width="330" height="380" rx="12" fill="url(#blue)" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>

  <!-- Column 1 header -->
  <rect x="60" y="115" width="330" height="54" rx="12" fill="#3b82f6" opacity="0.2"/>
  <rect x="60" y="145" width="330" height="24" fill="#3b82f6" opacity="0.1"/>
  <text x="225" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#3b82f6" text-anchor="middle" font-weight="bold">Персонализация</text>
  <text x="225" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Механизм 1 — Платформа адаптирует</text>

  <!-- Column 1 icon: person → platform → content -->
  <g transform="translate(225, 240)">
    <!-- Person circle -->
    <circle cx="-75" cy="0" r="28" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="-75" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#3b82f6" text-anchor="middle">👤</text>
    <text x="-75" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">Профиль</text>

    <!-- Arrow -->
    <line x1="-44" y1="0" x2="-10" y2="0" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <polygon points="-10,-5 2,0 -10,5" fill="#3b82f6" opacity="0.6"/>

    <!-- ЦД box -->
    <rect x="2" y="-20" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="22" y="-2" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="bold">ЦД</text>
    <text x="22" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#93c5fd" text-anchor="middle">двойник</text>

    <!-- Arrow -->
    <line x1="44" y1="0" x2="46" y2="0" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <polygon points="46,-5 58,0 46,5" fill="#3b82f6" opacity="0.6"/>

    <!-- Портной -->
    <circle cx="75" cy="0" r="28" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="75" y="-6" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="bold">Портной</text>
    <text x="75" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">ИИ-агент</text>
  </g>

  <!-- Column 1 details -->
  <text x="90" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Читает твой цифровой двойник</text>
  <text x="90" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Генерирует контент под состояние</text>
  <text x="90" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Хаос / тупик / поворот → стиль</text>
  <text x="90" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Bloom level → сложность</text>

  <!-- Status badge -->
  <rect x="90" y="380" width="80" height="22" rx="11" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="130" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">✓ Готово</text>

  <!-- Actors -->
  <text x="225" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle" opacity="0.8">Портной · Тест систематичности</text>
  <text x="225" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle" opacity="0.8">Лента · Дайджест</text>

  <!-- === COLUMN 2: ИНДИВИДУАЛИЗАЦИЯ === -->
  <rect x="435" y="115" width="330" height="380" rx="12" fill="url(#purple)" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>

  <!-- Column 2 header -->
  <rect x="435" y="115" width="330" height="54" rx="12" fill="#8b5cf6" opacity="0.2"/>
  <rect x="435" y="145" width="330" height="24" fill="#8b5cf6" opacity="0.1"/>
  <text x="600" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="bold">Индивидуализация</text>
  <text x="600" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">Механизм 2 — Человек настраивает сам</text>

  <!-- Column 2 icon: fork + customize -->
  <g transform="translate(600, 240)">
    <!-- Template -->
    <rect x="-80" y="-25" width="50" height="50" rx="6" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="-55" y="-5" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="bold">FMT</text>
    <text x="-55" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">шаблон</text>

    <!-- Fork arrow -->
    <line x1="-28" y1="-10" x2="-5" y2="-10" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-5" y1="-10" x2="10" y2="-25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-5" y1="-10" x2="10" y2="5" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <polygon points="10,-30 22,-25 10,-20" fill="#8b5cf6" opacity="0.6"/>
    <polygon points="10,0 22,5 10,10" fill="#8b5cf6" opacity="0.6"/>

    <!-- Personal IWE -->
    <rect x="23" y="-38" width="55" height="28" rx="5" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="50" y="-22" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle" font-weight="bold">Personal</text>
    <text x="50" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#a78bfa" text-anchor="middle">Pack · Rules</text>

    <rect x="23" y="-5" width="55" height="28" rx="5" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="50" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle" font-weight="bold">Свои</text>
    <text x="50" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#a78bfa" text-anchor="middle">протоколы</text>
  </g>

  <!-- Column 2 details -->
  <text x="465" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Форк шаблона IWE под себя</text>
  <text x="465" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ params.yaml · extensions/</text>
  <text x="465" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Личный Pack знаний</text>
  <text x="465" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Контроль остаётся у человека</text>

  <!-- Status badge -->
  <rect x="465" y="380" width="80" height="22" rx="11" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="505" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">✓ Готово</text>

  <!-- Actors -->
  <text x="600" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" opacity="0.8">FMT-exocortex-template · setup.sh</text>
  <text x="600" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" opacity="0.8">Personal IWE (T4)</text>

  <!-- === COLUMN 3: АДАПТИВНОСТЬ === -->
  <rect x="810" y="115" width="330" height="380" rx="12" fill="url(#green)" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>

  <!-- Column 3 header -->
  <rect x="810" y="115" width="330" height="54" rx="12" fill="#10b981" opacity="0.2"/>
  <rect x="810" y="145" width="330" height="24" fill="#10b981" opacity="0.1"/>
  <text x="975" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#10b981" text-anchor="middle" font-weight="bold">Адаптивность</text>
  <text x="975" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Механизм 3 — Система учится во времени</text>

  <!-- Column 3 icon: feedback loop -->
  <g transform="translate(975, 240)">
    <!-- Central ЦД -->
    <circle cx="0" cy="0" r="30" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-5" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle" font-weight="bold">BKT</text>
    <text x="0" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6ee7b7" text-anchor="middle">HLR</text>

    <!-- Feedback loop arc top -->
    <path d="M -20,-28 A 40,40 0 0,1 20,-28" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <polygon points="20,-28 28,-20 14,-22" fill="#10b981" opacity="0.5"/>

    <!-- Feedback loop arc bottom -->
    <path d="M 20,28 A 40,40 0 0,1 -20,28" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <polygon points="-20,28 -28,20 -14,22" fill="#10b981" opacity="0.5"/>

    <!-- Left: действие -->
    <circle cx="-75" cy="0" r="22" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <text x="-75" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Ответ</text>
    <text x="-75" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">урок</text>

    <!-- Right: рекомендация -->
    <circle cx="75" cy="0" r="22" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <text x="75" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Повтор</text>
    <text x="75" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">вовремя</text>

    <!-- Arrows left→center -->
    <line x1="-52" y1="0" x2="-32" y2="0" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
    <polygon points="-32,-4 -20,0 -32,4" fill="#10b981" opacity="0.5"/>

    <!-- Arrows center→right -->
    <line x1="32" y1="0" x2="52" y2="0" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
    <polygon points="52,-4 64,0 52,4" fill="#10b981" opacity="0.5"/>
  </g>

  <!-- Column 3 details -->
  <text x="840" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Обновляет модель знаний в реальном</text>
  <text x="840" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">   времени после каждого ответа</text>
  <text x="840" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Моделирует забывание (HLR)</text>
  <text x="840" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">▸ Предлагает повтор до порога P=0.9</text>

  <!-- Status badge: в разработке -->
  <rect x="840" y="380" width="120" height="22" rx="11" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="900" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">⟳ В разработке</text>

  <!-- Actors -->
  <text x="975" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34d399" text-anchor="middle" opacity="0.8">Цифровой двойник · ЦД</text>
  <text x="975" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34d399" text-anchor="middle" opacity="0.8">BKT · HLR · Recalculate</text>

  <!-- Bottom umbrella label -->
  <rect x="200" y="510" width="800" height="38" rx="10" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <text x="600" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold">Adaptive Personalization — Адаптивная персонализация</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.6"/>
</svg>
