<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Title -->
  <text x="600" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="bold">Три слоя адаптивной персонализации</text>
  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#475569" text-anchor="middle">Платформа, которая знает тебя</text>

  <!-- Divider -->
  <line x1="60" y1="96" x2="1140" y2="96" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ========== COLUMN 1: ПЕРСОНАЛИЗАЦИЯ ========== -->
  <!-- Card background -->
  <rect x="40" y="108" width="350" height="430" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- Header fill -->
  <rect x="40" y="108" width="350" height="66" rx="14" fill="#2563eb"/>
  <rect x="40" y="158" width="350" height="16" fill="#2563eb"/>

  <!-- Header text -->
  <text x="215" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">Персонализация</text>
  <text x="215" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#bfdbfe" text-anchor="middle">Механизм 1 — Платформа адаптирует</text>

  <!-- Diagram: Профиль → ЦД → Портной -->
  <g transform="translate(215, 240)">
    <rect x="-140" y="-26" width="70" height="52" rx="8" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="-105" y="-6" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Профиль</text>
    <text x="-105" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">пользователя</text>

    <line x1="-68" y1="0" x2="-42" y2="0" stroke="#2563eb" stroke-width="2"/>
    <polygon points="-42,-6 -28,0 -42,6" fill="#2563eb"/>

    <rect x="-28" y="-26" width="56" height="52" rx="8" fill="#2563eb" opacity="0.18" stroke="#2563eb" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="bold">ЦД</text>
    <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">двойник</text>

    <line x1="30" y1="0" x2="54" y2="0" stroke="#2563eb" stroke-width="2"/>
    <polygon points="54,-6 68,0 54,6" fill="#2563eb"/>

    <rect x="68" y="-26" width="72" height="52" rx="8" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="104" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Портной</text>
    <text x="104" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">ИИ-агент</text>
  </g>

  <!-- Details -->
  <text x="68" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e3a8a">▸ Читает цифровой двойник</text>
  <text x="68" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e3a8a">▸ Контент под состояние (хаос / тупик /</text>
  <text x="88" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e3a8a">поворот)</text>
  <text x="68" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e3a8a">▸ Bloom level → сложность задания</text>
  <text x="68" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e3a8a">▸ Тематика Ленты и Дайджеста</text>

  <!-- Status badge -->
  <rect x="68" y="420" width="110" height="28" rx="14" fill="#059669"/>
  <text x="123" y="439" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">✓ Реализовано</text>

  <!-- Footer -->
  <text x="215" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Портной · Тест систематичности</text>
  <text x="215" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">Лента · Дайджест · bloom_level</text>

  <!-- ========== COLUMN 2: ИНДИВИДУАЛИЗАЦИЯ ========== -->
  <rect x="425" y="108" width="350" height="430" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="425" y="108" width="350" height="66" rx="14" fill="#7c3aed"/>
  <rect x="425" y="158" width="350" height="16" fill="#7c3aed"/>

  <text x="600" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">Индивидуализация</text>
  <text x="600" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ddd6fe" text-anchor="middle">Механизм 2 — Человек настраивает сам</text>

  <!-- Diagram: шаблон → форк → personal IWE -->
  <g transform="translate(600, 240)">
    <rect x="-140" y="-26" width="70" height="52" rx="8" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="-105" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b0764" text-anchor="middle" font-weight="bold">FMT</text>
    <text x="-105" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">шаблон</text>

    <!-- Fork: two arrows -->
    <line x1="-68" y1="0" x2="-44" y2="0" stroke="#7c3aed" stroke-width="2"/>
    <line x1="-44" y1="0" x2="-30" y2="-20" stroke="#7c3aed" stroke-width="2"/>
    <line x1="-44" y1="0" x2="-30" y2="20" stroke="#7c3aed" stroke-width="2"/>
    <polygon points="-30,-25 -18,-20 -30,-15" fill="#7c3aed"/>
    <polygon points="-30,15 -18,20 -30,25" fill="#7c3aed"/>

    <rect x="-18" y="-46" width="80" height="36" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="22" y="-26" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b0764" text-anchor="middle" font-weight="bold">Personal Pack</text>
    <text x="22" y="-12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">знания, правила</text>

    <rect x="-18" y="10" width="80" height="36" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="22" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b0764" text-anchor="middle" font-weight="bold">Протоколы</text>
    <text x="22" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">под свой ритм</text>

    <text x="90" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#7c3aed" text-anchor="middle">⚙</text>
  </g>

  <text x="453" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b0764">▸ Форк шаблона IWE под себя</text>
  <text x="453" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b0764">▸ params.yaml · extensions/</text>
  <text x="453" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b0764">▸ Личный Pack знаний</text>
  <text x="453" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3b0764">▸ Контроль остаётся у человека</text>

  <rect x="453" y="400" width="110" height="28" rx="14" fill="#059669"/>
  <text x="508" y="419" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">✓ Реализовано</text>

  <text x="600" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">FMT-exocortex-template · setup.sh</text>
  <text x="600" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle">Personal IWE (T4) · extensions/</text>

  <!-- ========== COLUMN 3: АДАПТИВНОСТЬ ========== -->
  <rect x="810" y="108" width="350" height="430" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="810" y="108" width="350" height="66" rx="14" fill="#059669"/>
  <rect x="810" y="158" width="350" height="16" fill="#059669"/>

  <text x="985" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">Адаптивность</text>
  <text x="985" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">Механизм 3 — Система учится со временем</text>

  <!-- Diagram: feedback loop -->
  <g transform="translate(985, 240)">
    <!-- BKT/HLR centre -->
    <circle cx="0" cy="0" r="38" fill="#059669" opacity="0.12" stroke="#059669" stroke-width="2"/>
    <text x="0" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#064e3b" text-anchor="middle" font-weight="bold">BKT</text>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#064e3b" text-anchor="middle" font-weight="bold">HLR</text>

    <!-- Arc top (ответ → модель) -->
    <path d="M -30,-32 A 50,50 0 0,1 30,-32" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.7"/>
    <polygon points="30,-32 40,-22 20,-24" fill="#059669" opacity="0.7"/>

    <!-- Arc bottom (модель → повтор) -->
    <path d="M 30,32 A 50,50 0 0,1 -30,32" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.7"/>
    <polygon points="-30,32 -40,22 -20,24" fill="#059669" opacity="0.7"/>

    <!-- Left node -->
    <rect x="-140" y="-24" width="68" height="48" rx="8" fill="#059669" opacity="0.12" stroke="#059669" stroke-width="1.5"/>
    <text x="-106" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#064e3b" text-anchor="middle" font-weight="bold">Ответ</text>
    <text x="-106" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065f46" text-anchor="middle">на урок</text>
    <line x1="-70" y1="0" x2="-40" y2="0" stroke="#059669" stroke-width="2"/>
    <polygon points="-40,-5 -28,0 -40,5" fill="#059669"/>

    <!-- Right node -->
    <rect x="72" y="-24" width="68" height="48" rx="8" fill="#059669" opacity="0.12" stroke="#059669" stroke-width="1.5"/>
    <text x="106" y="-4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#064e3b" text-anchor="middle" font-weight="bold">Повтор</text>
    <text x="106" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065f46" text-anchor="middle">вовремя</text>
    <line x1="40" y1="0" x2="70" y2="0" stroke="#059669" stroke-width="2"/>
    <polygon points="70,-5 82,0 70,5" fill="#059669"/>
  </g>

  <text x="838" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#064e3b">▸ Модель знаний обновляется после</text>
  <text x="858" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#064e3b">каждого ответа</text>
  <text x="838" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#064e3b">▸ Моделирует забывание (HLR)</text>
  <text x="838" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#064e3b">▸ Повтор до порога P = 0.9</text>

  <rect x="838" y="400" width="140" height="28" rx="14" fill="#d97706"/>
  <text x="908" y="419" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">⟳ В разработке</text>

  <text x="985" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold">Цифровой двойник · Recalculate</text>
  <text x="985" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">BKT · HLR · activity-hub</text>

  <!-- ========== BOTTOM UMBRELLA ========== -->
  <rect x="120" y="548" width="960" height="42" rx="12" fill="#0f172a"/>
  <text x="600" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Adaptive Personalization — Адаптивная персонализация</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent)"/>
</svg>
