<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="mcp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mcp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mcp3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)" rx="0"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Knowledge Gateway — единая точка входа</text>

  <!-- User / LLM row -->
  <rect x="50" y="70" width="160" height="55" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Claude Code</text>
  <text x="130" y="113" text-anchor="middle" fill="#94a3b8" font-size="11">VS Code</text>

  <rect x="230" y="70" width="160" height="55" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="310" y="95" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Claude Desktop</text>
  <text x="310" y="113" text-anchor="middle" fill="#94a3b8" font-size="11">claude.ai</text>

  <rect x="410" y="70" width="160" height="55" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="490" y="95" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Cursor / Windsurf</text>
  <text x="490" y="113" text-anchor="middle" fill="#94a3b8" font-size="11">IDE</text>

  <rect x="590" y="70" width="160" height="55" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="670" y="95" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">ChatGPT</text>
  <text x="670" y="113" text-anchor="middle" fill="#94a3b8" font-size="11">любая LLM</text>

  <rect x="770" y="70" width="100" height="55" rx="10" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="820" y="95" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">...</text>
  <text x="820" y="113" text-anchor="middle" fill="#94a3b8" font-size="11">MCP connect</text>

  <!-- Arrows down to Gateway -->
  <line x1="130" y1="125" x2="130" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="125" x2="310" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="490" y1="125" x2="490" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="670" y1="125" x2="670" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="820" y1="125" x2="820" y2="165" stroke="#475569" stroke-width="1.5"/>

  <!-- Collector line -->
  <line x1="130" y1="165" x2="820" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="450" y1="165" x2="450" y2="185" stroke="#475569" stroke-width="2"/>

  <!-- Knowledge Gateway -->
  <rect x="200" y="185" width="500" height="60" rx="14" fill="url(#gw)" stroke="#818cf8" stroke-width="2"/>
  <text x="450" y="215" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Knowledge Gateway</text>
  <text x="450" y="235" text-anchor="middle" fill="#c7d2fe" font-size="12">один адрес = всё знание</text>

  <!-- Arrows from Gateway to 3 MCPs -->
  <line x1="300" y1="245" x2="160" y2="310" stroke="#818cf8" stroke-width="2"/>
  <line x1="450" y1="245" x2="450" y2="310" stroke="#818cf8" stroke-width="2"/>
  <line x1="600" y1="245" x2="740" y2="310" stroke="#818cf8" stroke-width="2"/>

  <!-- MCP 1: knowledge-mcp -->
  <rect x="40" y="310" width="240" height="80" rx="12" fill="url(#mcp1)" opacity="0.9"/>
  <text x="160" y="340" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">knowledge-mcp</text>
  <text x="160" y="358" text-anchor="middle" fill="#164e63" font-size="11">Платформенное знание</text>
  <text x="160" y="378" text-anchor="middle" fill="#164e63" font-size="11">FPF, SPF, Pack, docs  ~8 800 док</text>

  <!-- MCP 2: personal-knowledge-mcp -->
  <rect x="330" y="310" width="240" height="80" rx="12" fill="url(#mcp2)" opacity="0.9"/>
  <text x="450" y="340" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">personal-knowledge-mcp</text>
  <text x="450" y="358" text-anchor="middle" fill="#ddd6fe" font-size="11">Личная база знаний</text>
  <text x="450" y="378" text-anchor="middle" fill="#ddd6fe" font-size="11">стратегия, заметки, руководство</text>

  <!-- MCP 3: digital-twin-mcp -->
  <rect x="620" y="310" width="240" height="80" rx="12" fill="url(#mcp3)" opacity="0.9"/>
  <text x="740" y="340" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">digital-twin-mcp</text>
  <text x="740" y="358" text-anchor="middle" fill="#064e3b" font-size="11">Цифровой двойник</text>
  <text x="740" y="378" text-anchor="middle" fill="#064e3b" font-size="11">прогресс, профиль, области</text>

  <!-- Labels at bottom -->
  <text x="160" y="415" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600">бесплатно, для всех</text>
  <text x="450" y="415" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="600">изоляция по user_id</text>
  <text x="740" y="415" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">изоляция по user_id</text>

  <!-- Bottom: repos examples -->
  <rect x="40" y="435" width="240" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="160" y="458" text-anchor="middle" fill="#94a3b8" font-size="10">FPF  SPF  PACK-*  docs</text>
  <text x="160" y="474" text-anchor="middle" fill="#94a3b8" font-size="10">FMT-*  DS-ecosystem-dev</text>

  <rect x="330" y="435" width="240" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" fill="#94a3b8" font-size="10">DS-my-strategy</text>
  <text x="450" y="474" text-anchor="middle" fill="#94a3b8" font-size="10">DS-creator-development  DS-Knowledge-*</text>

  <rect x="620" y="435" width="240" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="740" y="458" text-anchor="middle" fill="#94a3b8" font-size="10">прогресс по курсам</text>
  <text x="740" y="474" text-anchor="middle" fill="#94a3b8" font-size="10">профиль мышления  активные области</text>
</svg>
