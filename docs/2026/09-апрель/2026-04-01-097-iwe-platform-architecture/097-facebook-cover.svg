<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">Архитектура IWE: три уровня</text>
  <text x="600" y="80" text-anchor="middle" fill="#64748b" font-size="14">Intellectual Work Environment -- среда для интеллектуальной работы</text>

  <!-- ====== LEVEL 1: PLATFORM ====== -->
  <rect x="50" y="100" width="1100" height="170" rx="14" fill="#1e3a5f" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <rect x="50" y="100" width="280" height="28" rx="14" fill="#2563eb" opacity="0.8"/>
  <text x="70" y="119" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="1">УРОВЕНЬ 1: ПЛАТФОРМА</text>

  <!-- Platform items row 1 -->
  <rect x="80" y="140" width="230" height="52" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="195" y="163" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">Знания МИМ</text>
  <text x="195" y="180" text-anchor="middle" fill="#64748b" font-size="10">методология, системное мышление</text>

  <rect x="330" y="140" width="230" height="52" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="445" y="163" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">IWE-шаблон</text>
  <text x="445" y="180" text-anchor="middle" fill="#64748b" font-size="10">авто-форк при регистрации</text>

  <rect x="580" y="140" width="230" height="52" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="695" y="163" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">Embeddings</text>
  <text x="695" y="180" text-anchor="middle" fill="#64748b" font-size="10">pgvector / Neon, 5000+ документов</text>

  <rect x="830" y="140" width="290" height="52" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="975" y="163" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">Агенты платформы</text>
  <text x="975" y="180" text-anchor="middle" fill="#64748b" font-size="10">Портной, Оценщик, Оркестратор</text>

  <!-- Platform items row 2: 3 MCP servers -->
  <rect x="80" y="204" width="340" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
  <text x="250" y="226" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">knowledge-mcp</text>
  <text x="250" y="244" text-anchor="middle" fill="#64748b" font-size="10">L2 платформа: 16 источников, 3300+ документов</text>

  <rect x="435" y="204" width="290" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
  <text x="580" y="226" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">digital-twin-mcp</text>
  <text x="580" y="244" text-anchor="middle" fill="#64748b" font-size="10">цифровой двойник пользователя</text>

  <rect x="740" y="204" width="380" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
  <text x="930" y="226" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">personal-knowledge-mcp</text>
  <text x="930" y="244" text-anchor="middle" fill="#64748b" font-size="10">L4 личное: Pack + embeddings, 1700+ документов</text>

  <!-- ====== MCP GATEWAY ====== -->
  <rect x="200" y="295" width="800" height="75" rx="14" fill="#2d1b69" opacity="0.5" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow)"/>
  <text x="600" y="328" text-anchor="middle" fill="#e9d5ff" font-size="22" font-weight="700">MCP Gateway</text>
  <text x="600" y="352" text-anchor="middle" fill="#a78bfa" font-size="12">mcp.aisystant.com  |  OAuth (Ory)  |  fan-out поиск по 3 серверам  |  SLA 200ms  |  изоляция данных</text>

  <!-- Arrows Platform -> Gateway -->
  <line x1="250" y1="256" x2="350" y2="295" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="580" y1="256" x2="550" y2="295" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="930" y1="256" x2="800" y2="295" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Arrow Gateway -> User -->
  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>
  <line x1="600" y1="370" x2="600" y2="400" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowP)"/>
  <text x="700" y="390" fill="#a78bfa" font-size="11" font-style="italic">поставляет IWE + сервисы</text>

  <!-- ====== LEVEL 2: USER IWE ====== -->
  <rect x="50" y="405" width="1100" height="80" rx="14" fill="#064e3b" opacity="0.25" stroke="#10b981" stroke-width="2"/>
  <rect x="50" y="405" width="350" height="28" rx="14" fill="#059669" opacity="0.8"/>
  <text x="70" y="424" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="1">УРОВЕНЬ 2: ЛИЧНЫЙ IWE ПОЛЬЗОВАТЕЛЯ</text>

  <rect x="80" y="442" width="320" height="33" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.5"/>
  <text x="240" y="463" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">Pack / DS репо на GitHub</text>

  <rect x="420" y="442" width="320" height="33" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.5"/>
  <text x="580" y="463" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">Протоколы и роли (CLAUDE.md)</text>

  <rect x="760" y="442" width="360" height="33" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.5"/>
  <text x="940" y="463" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">MCP-подключения и настройки</text>

  <!-- Arrow User -> Agents -->
  <line x1="600" y1="485" x2="600" y2="510" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="700" y="503" fill="#6ee7b7" font-size="11" font-style="italic">подключает через Gateway</text>

  <!-- ====== LEVEL 3: AGENTS ====== -->
  <rect x="50" y="515" width="1100" height="65" rx="14" fill="#451a03" opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
  <rect x="50" y="515" width="320" height="28" rx="14" fill="#d97706" opacity="0.8"/>
  <text x="70" y="534" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="1">УРОВЕНЬ 3: ВЕНДОРСКИЕ АГЕНТЫ</text>

  <rect x="80" y="549" width="190" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="175" y="566" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">Claude</text>

  <rect x="290" y="549" width="190" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="385" y="566" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">GPT</text>

  <rect x="500" y="549" width="190" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="595" y="566" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">Gemini</text>

  <rect x="710" y="549" width="190" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="805" y="566" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">Grok</text>

  <rect x="920" y="549" width="200" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="1020" y="566" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">Любой агент</text>

  <!-- Bottom line -->
  <rect x="50" y="598" width="1100" height="24" rx="4" fill="#0f172a" opacity="0.8" stroke="#334155" stroke-width="0.5"/>
  <text x="600" y="614" text-anchor="middle" fill="#94a3b8" font-size="11">Данные (репо) живут у пользователя  ·  Вычислительное (embeddings, поиск, агенты) на платформе  ·  Gateway соединяет</text>

</svg>
