<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Архитектура IWE: три уровня</text>

  <!-- === LEVEL 1: Aisystant Platform === -->
  <rect x="40" y="65" width="720" height="155" rx="12" fill="url(#platformGrad)" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="90" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="1.5">УРОВЕНЬ 1: ПЛАТФОРМА AISYSTANT</text>

  <!-- Platform boxes -->
  <rect x="60" y="102" width="155" height="50" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="137" y="123" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Знания МИМ</text>
  <text x="137" y="140" text-anchor="middle" fill="#64748b" font-size="9">методология, мышление</text>

  <rect x="230" y="102" width="155" height="50" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="307" y="123" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">IWE-шаблон</text>
  <text x="307" y="140" text-anchor="middle" fill="#64748b" font-size="9">FMT-exocortex-template</text>

  <rect x="400" y="102" width="155" height="50" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="477" y="123" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Агенты платформы</text>
  <text x="477" y="140" text-anchor="middle" fill="#64748b" font-size="9">Портной, Оценщик</text>

  <rect x="570" y="102" width="175" height="50" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="657" y="123" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Embeddings</text>
  <text x="657" y="140" text-anchor="middle" fill="#64748b" font-size="9">pgvector / Neon</text>

  <!-- Three MCP servers inside platform -->
  <rect x="60" y="162" width="220" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="170" y="182" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="600">knowledge-mcp</text>
  <text x="170" y="198" text-anchor="middle" fill="#64748b" font-size="9">L2 платформа: 16 источников</text>

  <rect x="290" y="162" width="220" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="400" y="182" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="600">digital-twin-mcp</text>
  <text x="400" y="198" text-anchor="middle" fill="#64748b" font-size="9">цифровой двойник пользователя</text>

  <rect x="520" y="162" width="225" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="632" y="182" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="600">personal-knowledge-mcp</text>
  <text x="632" y="198" text-anchor="middle" fill="#64748b" font-size="9">L4 личное: Pack + embeddings</text>

  <!-- === LEVEL 2: MCP Gateway === -->
  <rect x="150" y="245" width="500" height="70" rx="12" fill="url(#gatewayGrad)" opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="272" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="700">MCP Gateway</text>
  <text x="400" y="293" text-anchor="middle" fill="#a78bfa" font-size="11">mcp.aisystant.com  |  OAuth (Ory)  |  fan-out поиск  |  SLA 200ms</text>

  <!-- Arrows: Platform -> Gateway -->
  <line x1="170" y1="210" x2="270" y2="245" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="400" y1="210" x2="400" y2="245" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="632" y1="210" x2="530" y2="245" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- === LEVEL 3: Личный IWE === -->
  <rect x="40" y="345" width="720" height="110" rx="12" fill="url(#userGrad)" opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="370" fill="#6ee7b7" font-size="11" font-weight="600" letter-spacing="1.5">УРОВЕНЬ 2: ЛИЧНЫЙ IWE ПОЛЬЗОВАТЕЛЯ</text>

  <!-- User boxes -->
  <rect x="60" y="385" width="220" height="55" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#10b981" stroke-width="0.5"/>
  <text x="170" y="406" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Pack / DS репо</text>
  <text x="170" y="423" text-anchor="middle" fill="#64748b" font-size="9">исходник знания, GitHub</text>
  <text x="170" y="435" text-anchor="middle" fill="#475569" font-size="8">webhook → авто-индексация</text>

  <rect x="290" y="385" width="220" height="55" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#10b981" stroke-width="0.5"/>
  <text x="400" y="406" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Протоколы и роли</text>
  <text x="400" y="423" text-anchor="middle" fill="#64748b" font-size="9">CLAUDE.md, memory/, skills/</text>

  <rect x="520" y="385" width="225" height="55" rx="8" fill="#1e293b" filter="url(#shadow)" stroke="#10b981" stroke-width="0.5"/>
  <text x="632" y="406" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Настройки среды</text>
  <text x="632" y="423" text-anchor="middle" fill="#64748b" font-size="9">MCP-подключения, параметры</text>

  <!-- Arrows: Gateway -> User IWE -->
  <path d="M400 315 L400 345" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="460" y="334" fill="#a78bfa" font-size="9" font-style="italic">поставляет IWE + сервисы</text>

  <!-- === LEVEL 4: Agents === -->
  <rect x="100" y="490" width="600" height="70" rx="12" fill="url(#agentGrad)" opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="515" fill="#fcd34d" font-size="11" font-weight="600" letter-spacing="1.5">УРОВЕНЬ 3: ВЕНДОРСКИЕ АГЕНТЫ</text>

  <!-- Agent icons -->
  <rect x="120" y="525" width="130" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="185" y="544" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Claude</text>

  <rect x="265" y="525" width="130" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="330" y="544" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">GPT</text>

  <rect x="410" y="525" width="130" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="475" y="544" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Gemini</text>

  <rect x="555" y="525" width="130" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="620" y="544" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Любой агент</text>

  <!-- Arrow: User IWE -> Agents -->
  <path d="M400 455 L400 490" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="460" y="477" fill="#6ee7b7" font-size="9" font-style="italic">подключает Gateway</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Key insight box -->
  <rect x="40" y="570" width="720" height="24" rx="4" fill="#1e293b" opacity="0.8"/>
  <text x="400" y="586" text-anchor="middle" fill="#94a3b8" font-size="10">Данные (репо) живут у пользователя  ·  Вычислительное (embeddings, поиск, агенты) на платформе  ·  Gateway соединяет</text>

</svg>
