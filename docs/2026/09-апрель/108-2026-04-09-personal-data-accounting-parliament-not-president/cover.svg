<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Left side: "President" model (single node) -->
  <g transform="translate(200, 280)">
    <!-- Central big circle (president) -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="55" fill="#ef4444" opacity="0.15"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">ВСЕ ДАННЫЕ</text>

    <!-- Connected small nodes -->
    <line x1="60" y1="-30" x2="120" y2="-70" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <circle cx="120" cy="-70" r="15" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>

    <line x1="60" y1="30" x2="120" y2="70" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <circle cx="120" cy="70" r="15" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>

    <line x1="-60" y1="-30" x2="-120" y2="-70" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <circle cx="-120" cy="-70" r="15" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>

    <line x1="-60" y1="30" x2="-120" y2="70" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <circle cx="-120" cy="70" r="15" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>

    <line x1="0" y1="-60" x2="0" y2="-110" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="-110" r="15" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>

    <line x1="0" y1="60" x2="0" y2="110" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="110" r="15" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>

    <!-- Cross mark -->
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ef4444" text-anchor="middle" opacity="0.8">Президент</text>
  </g>

  <!-- Arrow between models -->
  <g transform="translate(500, 280)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
    <polygon points="80,-6 92,0 80,6" fill="url(#accent)" opacity="0.6"/>
    <text x="46" y="-15" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">vs</text>
  </g>

  <!-- Right side: "Parliament" model (distributed) -->
  <g transform="translate(800, 280)">
    <!-- Distributed nodes (equal size) -->
    <circle cx="0" cy="-90" r="35" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="-86" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">PACK</text>
    <text x="0" y="-74" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">personal</text>

    <circle cx="90" cy="-30" r="35" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="90" y="-26" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle" font-weight="bold">PACK</text>
    <text x="90" y="-14" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">platform</text>

    <circle cx="60" cy="75" r="35" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="60" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle" font-weight="bold">PACK</text>
    <text x="60" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#22d3ee" text-anchor="middle">MIM</text>

    <circle cx="-60" cy="75" r="35" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="-60" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#10b981" text-anchor="middle" font-weight="bold">PACK</text>
    <text x="-60" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">ecosystem</text>

    <circle cx="-90" cy="-30" r="35" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="-90" y="-26" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">ПРОТОКОЛ</text>
    <text x="-90" y="-14" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">доступ</text>

    <!-- Connecting lines (protocol) -->
    <line x1="0" y1="-55" x2="60" y2="-45" stroke="#94a3b8" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
    <line x1="60" y1="-45" x2="60" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
    <line x1="60" y1="40" x2="-30" y2="55" stroke="#94a3b8" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
    <line x1="-30" y1="55" x2="-60" y2="-10" stroke="#94a3b8" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
    <line x1="-60" y1="-10" x2="0" y2="-55" stroke="#94a3b8" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>

    <!-- Label -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b82f6" text-anchor="middle" opacity="0.8">Парламент</text>
  </g>

  <!-- Title -->
  <text x="600" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#f8fafc" text-anchor="middle" font-weight="bold">Парламент вместо президента</text>
  <text x="600" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Учёт персональных данных в ИИ-среде</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.6"/>

  <!-- Triada labels at bottom -->
  <g transform="translate(600, 560)">
    <rect x="-250" y="-15" width="140" height="30" rx="15" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="-180" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold">УЧЁТ</text>

    <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b5cf6" text-anchor="middle" font-weight="bold">ДОСТУП</text>

    <rect x="110" y="-15" width="140" height="30" rx="15" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="180" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#10b981" text-anchor="middle" font-weight="bold">АУДИТ</text>
  </g>
</svg>
