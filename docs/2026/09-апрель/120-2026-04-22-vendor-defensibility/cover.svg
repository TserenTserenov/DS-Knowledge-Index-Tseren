<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <style>
      .page-title { fill: #0f172a; font-size: 32px; font-weight: 700; }
      .page-subtitle { fill: #475569; font-size: 17px; font-weight: 500; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }

      .card-header-vendors { fill: #2563eb; }
      .card-bg-vendors { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .card-tag-vendors { fill: #2563eb; font-size: 12px; font-weight: 600; letter-spacing: 1px; }

      .card-header-iwe { fill: #7c3aed; }
      .card-bg-iwe { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 1; }
      .card-tag-iwe { fill: #7c3aed; font-size: 12px; font-weight: 600; letter-spacing: 1px; }

      .card-title { fill: #ffffff; font-size: 20px; font-weight: 700; }
      .card-sub { fill: #ffffff; font-size: 13px; font-weight: 500; opacity: 0.9; letter-spacing: 1px; }
      .card-item { fill: #0f172a; font-size: 14px; font-weight: 500; }
      .arrow { fill: #94a3b8; }

      .banner-bg { fill: #0f172a; }
      .banner-text { fill: #ffffff; font-size: 16px; font-weight: 500; }
      .banner-accent { fill: #94a3b8; font-size: 12px; font-weight: 500; letter-spacing: 2px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="8" fill="url(#accentBar)"/>
  <rect x="0" y="8" width="1200" height="622" fill="#ffffff"/>

  <text class="page-title" x="600" y="60" text-anchor="middle">Что OpenAI сделает и чего не сделает</text>
  <text class="page-subtitle" x="600" y="90" text-anchor="middle">Школой нельзя стать за квартал</text>

  <line class="divider" x1="80" y1="120" x2="1120" y2="120"/>

  <!-- Левая карточка: что вендоры сделают -->
  <rect class="card-bg-vendors" x="80" y="150" width="480" height="350" rx="10"/>
  <rect class="card-header-vendors" x="80" y="150" width="480" height="70" rx="10"/>
  <rect class="card-header-vendors" x="80" y="200" width="480" height="20"/>

  <text class="card-sub" x="320" y="180" text-anchor="middle">ЧТО СДЕЛАЮТ ЛУЧШЕ НАС</text>
  <text class="card-title" x="320" y="205" text-anchor="middle">Вендоры → технология</text>

  <text class="card-item" x="110" y="260">✓ Модели мощнее, контекст длиннее</text>
  <text class="card-item" x="110" y="290">✓ Персонализация через данные масштаба</text>
  <text class="card-item" x="110" y="320">✓ Полировка интерфейса</text>
  <text class="card-item" x="110" y="350">✓ Техническая надёжность, скорость</text>
  <text class="card-item" x="110" y="380">✓ Интеграции и API</text>
  <text class="card-item" x="110" y="410">✓ А/Б тесты на сотнях миллионов</text>
  <text class="card-item" x="110" y="440">✓ Миллиардные бюджеты на R&amp;D</text>

  <text class="card-tag-vendors" x="110" y="480">ГОРИЗОНТАЛЬНАЯ ПЛАТФОРМА → МАСШТАБ</text>

  <!-- Стрелка между карточками -->
  <polygon class="arrow" points="580,305 620,325 620,345 580,365 600,345 570,345 570,325 600,325"/>

  <!-- Правая карточка: что НЕ сделают -->
  <rect class="card-bg-iwe" x="640" y="150" width="480" height="350" rx="10"/>
  <rect class="card-header-iwe" x="640" y="150" width="480" height="70" rx="10"/>
  <rect class="card-header-iwe" x="640" y="200" width="480" height="20"/>

  <text class="card-sub" x="880" y="180" text-anchor="middle">ЧЕГО НЕ СДЕЛАЮТ СТРУКТУРНО</text>
  <text class="card-title" x="880" y="205" text-anchor="middle">IWE → школа и сообщество</text>

  <text class="card-item" x="670" y="260">✓ Вертикальная методология</text>
  <text class="card-item" x="670" y="290">✓ Живые носители методологии</text>
  <text class="card-item" x="670" y="320">✓ Сообщество созидателей</text>
  <text class="card-item" x="670" y="350">✓ Скорость эволюции методологии</text>
  <text class="card-item" x="670" y="380">✓ Позиция: где человек сейчас и куда</text>
  <text class="card-item" x="670" y="410">✓ Взаимная поддержка и репутация</text>
  <text class="card-item" x="670" y="440">✓ Открытость как стратегия</text>

  <text class="card-tag-iwe" x="670" y="480">ДЕСЯТИЛЕТИЯ ЖИВОЙ ПРАКТИКИ → РОВ</text>

  <!-- Нижний баннер -->
  <rect class="banner-bg" x="0" y="540" width="1200" height="82"/>
  <text class="banner-accent" x="600" y="568" text-anchor="middle">ПОЧЕМУ IWE ВЫДЕРЖИТ КОНКУРЕНЦИЮ С ВЕНДОРАМИ</text>
  <text class="banner-text" x="600" y="595" text-anchor="middle">Методологию можно скопировать. Школу и сообщество — нет.</text>
  <text class="banner-text" x="600" y="615" text-anchor="middle">Мы не соревнуемся с OpenAI в моделях. Мы играем на два порядка дольше.</text>

  <rect x="0" y="622" width="1200" height="8" fill="url(#accentBar)"/>
</svg>
