<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="8" fill="url(#topbar)"/>

  <text x="60" y="78" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0f172a">Конвейер навыка: карта из четырёх узлов, где он ломается</text>
  <text x="60" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#475569">14 механизмов срыва из поведенческой науки — и ни один не лечится силой воли</text>

  <line x1="60" y1="136" x2="1140" y2="136" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Node 1: Мотивация -->
  <rect x="60" y="166" width="250" height="300" rx="14" fill="#eff6ff"/>
  <rect x="60" y="166" width="250" height="52" rx="14" fill="#2563eb"/>
  <rect x="60" y="192" width="250" height="26" fill="#2563eb"/>
  <text x="185" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Мотивация</text>
  <text x="185" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">хочу ли я это вообще</text>
  <text x="80" y="284" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Нравится, но не делаю</text>
  <text x="80" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Не верю, что справлюсь</text>
  <text x="80" y="348" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Чужое «надо»</text>
  <text x="80" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb">Берридж · Бандура · Деси и Райан</text>

  <!-- Node 2: Запуск -->
  <rect x="336" y="166" width="250" height="300" rx="14" fill="#f5f3ff"/>
  <rect x="336" y="166" width="250" height="52" rx="14" fill="#7c3aed"/>
  <rect x="336" y="192" width="250" height="26" fill="#7c3aed"/>
  <text x="461" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Запуск</text>
  <text x="461" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle">от хотения к действию</text>
  <text x="356" y="284" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Не знаю, когда и как</text>
  <text x="356" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• В моменте расхотелось</text>
  <text x="356" y="348" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Откладываю</text>
  <text x="356" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Начал слишком мощно</text>
  <text x="356" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed">Голлвитцер · Лёвенстайн · Фогг</text>

  <!-- Node 3: Среда -->
  <rect x="612" y="166" width="250" height="300" rx="14" fill="#ecfdf5"/>
  <rect x="612" y="166" width="250" height="52" rx="14" fill="#059669"/>
  <rect x="612" y="192" width="250" height="26" fill="#059669"/>
  <text x="737" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Среда</text>
  <text x="737" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle">держится без усилия?</text>
  <text x="632" y="284" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Могу, но не делаю</text>
  <text x="632" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Забываю в моменте</text>
  <text x="632" y="348" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Один — и сдуваюсь</text>
  <text x="632" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#059669">Вуд · Айнштайн и МакДэниел · Ариели</text>

  <!-- Node 4: Рост -->
  <rect x="888" y="166" width="252" height="300" rx="14" fill="#fff7ed"/>
  <rect x="888" y="166" width="252" height="52" rx="14" fill="#d97706"/>
  <rect x="888" y="192" width="252" height="26" fill="#d97706"/>
  <text x="1014" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Рост</text>
  <text x="1014" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle">лучше, а не просто чаще</text>
  <text x="908" y="284" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Практикую, но не расту</text>
  <text x="908" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Стало скучно</text>
  <text x="908" y="348" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• Сорвался и бросил</text>
  <text x="908" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">• «Не хватило воли»</text>
  <text x="908" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d97706">Эрикссон · Марлатт · Хаггер 2016</text>

  <line x1="60" y1="502" x2="1140" y2="502" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="548" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Диагноз «я слабый» почти всегда неверный.</text>
  <text x="60" y="580" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Верный: «какой узел разболтался сегодня — и что в нём подкрутить».</text>
</svg>
